name: Build Android APK

# Builds the Android APK from the same shared web codebase.
#
# On a version tag this builds a debug APK and attaches it to the matching
# GitHub Release (created by release-bundle.yml). On manual runs it just
# produces the APK as a workflow artifact.
#
# Requires the Android SDK (provided by GitHub's ubuntu runners).

on:
  push:
    branches: [main, feature/android-loader]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not request the legacy "tools" package (it no longer exists
          # in the SDK repository and makes sdkmanager fail).
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install required SDK platforms/build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build:web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          # upload-artifact resolves paths from the workspace root, not the
          # job working-directory, so emit an absolute path.
          echo "path=$PWD/$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaceshooter-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # ---------------------------------------------------------------
      # Signed release APK (the one that gets distributed)
      # ---------------------------------------------------------------

      - name: Decode release keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - skipping the signed release APK"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        if: steps.keystore.outputs.ready == 'true'
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify release APK signature
        id: releaseapk
        if: steps.keystore.outputs.ready == 'true'
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)
          # Fails the job if the APK is unsigned or the signature is broken.
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "path=$PWD/$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload release APK artifact
        if: steps.keystore.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spaceshooter-release-apk
          path: ${{ steps.releaseapk.outputs.path }}
          if-no-files-found: error
