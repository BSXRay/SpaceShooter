name: Release Android web bundle

# Publishes a signed OTA web bundle as GitHub Release assets so the
# installed Android app can update itself. Triggered by pushing a
# version tag like v1.2.0.
#
# Produces (per release):
#   web-bundle-<version>.zip    the Capacitor web bundle
#   web-manifest-<version>.txt  <base64 Ed25519 signature>\n<json manifest>
#   release-info.json           checksum / size / signing info
#
# The manifest is signed with the SS_UPDATE_SIGNING_KEY secret. The matching
# public key is embedded in android-app/loader/updater-config.js.
#
# This workflow does NOT modify the existing Pages deployment workflow.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0). Must match a pushed tag for asset URLs to work."
        required: true

# Least privilege: only what the release job needs.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$V' is not semver (x.y.z)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Write version.json
        shell: bash
        run: |
          cat > version.json <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "appId": "io.github.bsxray.spaceshooter",
            "channel": "stable"
          }
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install required SDK platforms/build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build web bundle
        run: npm run build:web

      - name: Run tests
        run: npm test

      - name: Make signed release artifacts
        env:
          SS_UPDATE_SIGNING_KEY: ${{ secrets.SS_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -z "$SS_UPDATE_SIGNING_KEY" ]; then
            echo "::error::SS_UPDATE_SIGNING_KEY secret is not set. Refusing to publish an unsigned release."
            exit 1
          fi
          node scripts/make-bundle.mjs "${{ steps.ver.outputs.version }}"

      - name: Verify release artifacts
        run: node scripts/verify-release.mjs "${{ steps.ver.outputs.version }}"

      - name: Ensure artifacts are non-empty
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          test -s "dist/web-bundle-$V.zip" || { echo "::error::bundle missing/empty"; exit 1; }
          test -s "dist/web-manifest-$V.txt" || { echo "::error::manifest missing/empty"; exit 1; }

      # ---------------------------------------------------------------
      # Signed release APK, attached to the release for distribution
      # ---------------------------------------------------------------

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Cannot publish a signed release APK."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify release APK signature
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)
          # Fails the job if the APK is unsigned or the signature is broken.
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          V="${{ steps.ver.outputs.version }}"
          cp "$APK" "dist/spaceshooter-$V.apk"
          ls -la "dist/spaceshooter-$V.apk"

      - name: Upload release assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
          # The signed APK for installation plus the OTA bundle the
          # installed app pulls on start.
          files: |
            android-app/dist/spaceshooter-${{ steps.ver.outputs.version }}.apk
            android-app/dist/web-bundle-${{ steps.ver.outputs.version }}.zip
            android-app/dist/web-manifest-${{ steps.ver.outputs.version }}.txt
            android-app/dist/release-info.json
