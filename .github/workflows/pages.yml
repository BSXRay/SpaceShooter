name: Deploy web preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "images/**"
      - "sounds/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage site (web + shared assets)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r images _site/images
          cp -r sounds _site/sounds

      - name: Write version.json (latest release tag)
        run: |
          V="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          V="${V#v}"
          if [ -n "$V" ]; then
            printf '{\n  "version": "%s"\n}\n' "$V" > _site/version.json
            echo "site version: $V"
          fi

      - name: Upload _site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
