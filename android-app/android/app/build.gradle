apply plugin: 'com.android.application'

// Derive the Android version from android-app/version.json so the APK and the
// web bundle share a single version number (fewer manual steps).
def appVersionName = "1.0.0"
try {
    def versionFile = file("../../version.json")
    if (versionFile.exists()) {
        appVersionName = new groovy.json.JsonSlurper()
                .parseText(versionFile.text).version
    }
} catch (Exception ignored) {
    // Fall back to the default if version.json is missing/unreadable.
}

def appVersionCode = 1
try {
    def parts = appVersionName.tokenize(".")
    if (parts.size() >= 3) {
        appVersionCode = (parts[0] as int) * 10000 +
                (parts[1] as int) * 100 + (parts[2] as int)
    }
} catch (Exception ignored) {
    // Keep default versionCode.
}

// --------------------------------------------------
// RELEASE SIGNING
// --------------------------------------------------
// The release keystore is never committed. CI passes it through the
// environment (see .github/workflows/release-bundle.yml). For local
// release builds create `android-app/keystore.properties`:
//
//   storeFile=/absolute/path/to/spaceshooter-release.keystore
//   storePassword=...
//   keyAlias=spaceshooter
//   keyPassword=...
//
// Without signing material the release build stays unsigned, which is
// only useful for local smoke tests.

def keystoreProperties = new Properties()
def keystorePropertiesFile = file("../../keystore.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingStoreFile = System.getenv("ANDROID_KEYSTORE_PATH") ?:
        keystoreProperties.getProperty("storeFile")
def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?:
        keystoreProperties.getProperty("storePassword")
def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?:
        keystoreProperties.getProperty("keyAlias")
def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?:
        keystoreProperties.getProperty("keyPassword")

def releaseSigningReady = signingStoreFile && signingStorePassword &&
        signingKeyAlias && signingKeyPassword &&
        file(signingStoreFile).exists()

if (!releaseSigningReady) {
    logger.warn("No release signing material found - the release APK will be UNSIGNED")
}

android {
    namespace = "io.github.bsxray.spaceshooter"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.bsxray.spaceshooter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                // v1 + v2 signing: v2 is required for Android 7+, v1 keeps
                // the APK installable on Android 6 and older.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
